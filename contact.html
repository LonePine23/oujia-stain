<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Geordie Crawley</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="6e8639e8-bf58-459d-9a37-5f0f82788902"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      min-height:100%;
      font-family:'IBM Plex Mono',monospace;
      background:#0a0a0a;
      color:#f4f2ee;
    }

    .bg { position:fixed; inset:0; z-index:0; background:#0a0a0a; }
    .bg img {
      width:100%; height:100%; object-fit:cover;
      object-position:center center;
      opacity:0; transition:opacity 1.4s ease;
    }
    .bg img.loaded { opacity:1; }
    .bg::after {
      content:""; position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(8,9,12,0.46) 0%, rgba(8,9,12,0.38) 35%, rgba(8,9,12,0.66) 100%);
    }

    .page {
      position:relative; z-index:1;
      min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:clamp(80px,10vh,140px) clamp(20px,5vw,60px) clamp(120px,16vh,180px);
    }

    .container {
      width:100%;
      max-width:520px;
      opacity:0; transform:translateY(16px);
      transition:opacity 0.9s ease 0.25s, transform 0.9s ease 0.25s;
    }
    .container.visible { opacity:1; transform:translateY(0); }

    .title-block { text-align:center; margin-bottom:clamp(28px,4vh,44px); }
    .title-block h1 {
      font-family:'IBM Plex Mono',monospace;
      font-weight:700;
      font-size:clamp(2.4rem,7vw,4rem);
      letter-spacing:-0.02em;
      line-height:1.0;
      text-shadow:0 2px 40px rgba(0,0,0,0.5);
    }
    .title-block p {
      font-family:'Spectral',serif;
      font-style:italic;
      font-size:clamp(1.05rem,2.2vw,1.3rem);
      margin-top:16px;
      color:rgba(244,242,238,0.9);
      text-shadow:0 1px 14px rgba(0,0,0,0.5);
    }

    .links {
      display:flex; flex-direction:column; gap:12px;
    }
    .clink {
      display:flex; align-items:center; gap:18px;
      padding:18px 24px;
      border-radius:14px;
      background:rgba(18,18,20,0.42);
      backdrop-filter:blur(18px) saturate(1.2);
      -webkit-backdrop-filter:blur(18px) saturate(1.2);
      border:1px solid rgba(255,255,255,0.14);
      box-shadow:0 8px 28px rgba(0,0,0,0.28);
      color:#f4f2ee;
      text-decoration:none;
      transition:background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    }
    .clink:hover {
      background:rgba(30,30,32,0.5);
      border-color:rgba(255,255,255,0.3);
      transform:translateY(-2px);
    }
    .clink .label {
      flex:0 0 auto;
      font-family:'IBM Plex Mono',monospace;
      font-size:0.7rem;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:rgba(244,242,238,0.55);
      width:84px;
    }
    .clink .value {
      flex:1 1 auto;
      font-family:'Spectral',serif;
      font-size:clamp(1.05rem,1.8vw,1.25rem);
      line-height:1.3;
      word-break:break-word;
    }
    .clink .arrow {
      flex:0 0 auto;
      font-family:'IBM Plex Mono',monospace;
      font-size:0.95rem;
      color:rgba(244,242,238,0.5);
      opacity:0; transform:translateX(-4px);
      transition:opacity 0.3s ease, transform 0.3s ease;
    }
    .clink:hover .arrow { opacity:1; transform:translateX(0); }

    nav {
      position:fixed;
      bottom:clamp(20px,4vw,44px);
      left:50%; transform:translateX(-50%);
      display:flex; justify-content:center; align-items:center;
      gap:clamp(14px,3vw,40px);
      flex-wrap:wrap;
      z-index:3;
      padding:14px clamp(20px,4vw,36px);
      border-radius:16px;
      background:rgba(20,20,22,0.28);
      backdrop-filter:blur(16px) saturate(1.2);
      -webkit-backdrop-filter:blur(16px) saturate(1.2);
      border:1px solid rgba(255,255,255,0.14);
      box-shadow:0 8px 32px rgba(0,0,0,0.25);
      max-width:calc(100% - 32px);
      opacity:0;
      transition:opacity 0.6s ease 0.6s;
    }
    nav.visible { opacity:1; }
    nav a {
      font-family:'Spectral',serif;
      font-style:italic;
      font-weight:400;
      font-size:clamp(0.95rem,2vw,1.2rem);
      color:#f4f2ee;
      text-decoration:none;
      letter-spacing:0.01em;
      padding:2px 0;
      border-bottom:1.5px solid transparent;
      transition:border-color 0.3s ease, opacity 0.3s ease;
      text-shadow:0 1px 8px rgba(0,0,0,0.4);
      white-space:nowrap;
    }
    nav a:hover { border-bottom-color:currentColor; opacity:0.85; }

    @media (max-width:560px){
      nav { gap:6px 18px; }
      .clink .label { width:64px; }
    }
  
    /* --- Mobile collapsible nav --- */
    .nav-toggle { display:none; }
    .nav-links { display:contents; }
    @media (max-width:600px){
      nav {
        flex-direction:column;
        gap:0;
        padding:0;
        width:auto;
        max-width:calc(100% - 32px);
        overflow:hidden;
      }
      .nav-toggle {
        display:flex; align-items:center; justify-content:center; gap:9px;
        font-family:'IBM Plex Mono',monospace;
        font-size:0.82rem; letter-spacing:0.06em;
        color:#f4f2ee;
        background:none; border:none; cursor:pointer;
        padding:13px 26px;
        width:100%;
        text-shadow:0 1px 8px rgba(0,0,0,0.4);
      }
      .nav-toggle .bars {
        display:inline-flex; flex-direction:column; gap:3px;
      }
      .nav-toggle .bars span {
        display:block; width:16px; height:1.6px; background:currentColor;
        transition:transform 0.3s ease, opacity 0.3s ease;
      }
      nav.open .nav-toggle .bars span:nth-child(1){ transform:translateY(4.6px) rotate(45deg); }
      nav.open .nav-toggle .bars span:nth-child(2){ opacity:0; }
      nav.open .nav-toggle .bars span:nth-child(3){ transform:translateY(-4.6px) rotate(-45deg); }
      .nav-links {
        display:flex; flex-direction:column; align-items:center;
        gap:0;
        max-height:0; overflow:hidden;
        width:100%;
        transition:max-height 0.4s ease;
      }
      nav.open .nav-links { max-height:60vh; }
      .nav-links a {
        padding:13px 26px;
        width:100%; text-align:center;
        border-top:1px solid rgba(255,255,255,0.10);
        border-bottom:none;
      }
      .nav-links a:hover { border-bottom:none; }
    }
  </style>
</head>
<body>
  <div class="bg"><img id="bgImg" src="images/F1010004.jpg" alt=""></div>

  <div class="page">
    <div class="container" id="container">

      <div class="title-block">
        <h1>Contact</h1>
        <p>Get in touch, or find me elsewhere</p>
      </div>

      <div class="links">
        <a class="clink" href="mailto:geordie.business@hotmail.com">
          <span class="label">Email</span>
          <span class="value">geordie.business@hotmail.com</span>
          <span class="arrow">→</span>
        </a>
        <a class="clink" href="https://instagram.com/g.crawl" target="_blank" rel="noopener">
          <span class="label">Instagram</span>
          <span class="value">@g.crawl</span>
          <span class="arrow">↗</span>
        </a>
        <a class="clink" href="https://tiktok.com/@gcrawl" target="_blank" rel="noopener">
          <span class="label">TikTok</span>
          <span class="value">@gcrawl</span>
          <span class="arrow">↗</span>
        </a>
        <a class="clink" href="https://geordiedotlove.substack.com" target="_blank" rel="noopener">
          <span class="label">Substack</span>
          <span class="value">geordiedotlove.substack.com</span>
          <span class="arrow">↗</span>
        </a>
      </div>

    </div>
  </div>

  <nav id="nav">
    <button class="nav-toggle" aria-label="Menu"><span class="bars"><span></span><span></span><span></span></span>Menu</button>
    <div class="nav-links">
    <a href="/">Home</a>
    <a href="/game">Provenance</a>
    <a href="/scripts">Creative Works</a>
    <a href="/bio">Bio</a>
    </div>
  </nav>

  <script>
    const img = document.getElementById('bgImg');
    const container = document.getElementById('container');
    const nav = document.getElementById('nav');
    function reveal() {
      container.classList.add('visible');
      nav.classList.add('visible');
    }
    if (img.complete) { img.classList.add('loaded'); reveal(); }
    else {
      img.addEventListener('load', () => { img.classList.add('loaded'); reveal(); });
      img.addEventListener('error', reveal);
    }
  
    // Mobile nav toggle
    (function(){
      const navEl = document.getElementById('nav');
      const toggle = navEl ? navEl.querySelector('.nav-toggle') : null;
      if (toggle && navEl) {
        toggle.addEventListener('click', () => navEl.classList.toggle('open'));
        // close menu after tapping a link
        navEl.querySelectorAll('.nav-links a').forEach(a => {
          a.addEventListener('click', () => navEl.classList.remove('open'));
        });
      }
    })();
  </script>
</body>
</html>
