<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geordie Crawley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Spectral:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height:100%; overflow:hidden;
      font-family:'IBM Plex Mono',monospace;
      background:#0a0a0a;
    }
    .bg { position:fixed; inset:0; z-index:0; }
    .bg img {
      width:100%; height:100%; object-fit:cover;
      opacity:0; transition:opacity 1.2s ease;
    }
    .bg img.loaded { opacity:1; }

    .content {
      position:relative; z-index:1; height:100%;
      display:flex; align-items:center; justify-content:center;
      padding:clamp(24px,5vw,60px);
      text-align:center;
    }

    .name {
      font-size:clamp(2.2rem,8vw,6rem);
      font-weight:700;
      letter-spacing:-0.02em;
      line-height:1.05;
      opacity:0;
      transition:opacity 0.8s ease 0.4s;
      white-space:nowrap;
      user-select:none;
    }
    .name.visible { opacity:1; }
    .name .letter {
      display:inline-block;
      will-change:transform;
      transition:transform 0.55s cubic-bezier(0.34,1.56,0.4,1);
    }
    .name .space { display:inline-block; width:0.4em; }

    nav {
      position:fixed;
      bottom:clamp(20px,4vw,44px);
      left:50%; transform:translateX(-50%);
      display:flex; justify-content:center; align-items:center;
      gap:clamp(14px,3vw,40px);
      flex-wrap:wrap;
      z-index:2;
      padding:14px clamp(20px,4vw,36px);
      border-radius:16px;
      background:rgba(20,20,22,0.28);
      backdrop-filter:blur(16px) saturate(1.2);
      -webkit-backdrop-filter:blur(16px) saturate(1.2);
      border:1px solid rgba(255,255,255,0.14);
      box-shadow:0 8px 32px rgba(0,0,0,0.25);
      opacity:0;
      transition:opacity 0.6s ease 0.8s;
      max-width:calc(100% - 32px);
    }
    nav.visible { opacity:1; }
    nav a {
      font-family:'Spectral',serif;
      font-style:italic;
      font-weight:400;
      font-size:clamp(0.95rem,2vw,1.2rem);
      color:#f4f2ee;
      text-decoration:none;
      letter-spacing:0.01em;
      padding:2px 0;
      border-bottom:1.5px solid transparent;
      transition:border-color 0.3s ease, opacity 0.3s ease;
      text-shadow:0 1px 8px rgba(0,0,0,0.4);
      white-space:nowrap;
    }
    nav a:hover { border-bottom-color:currentColor; opacity:0.85; }
    #sampler { display:none; }

    @media (max-width:540px){
      .name { white-space:normal; }
      nav { gap:6px 18px; }
    }
  </style>
</head>
<body>
  <canvas id="sampler"></canvas>
  <div class="bg"><img id="bgImg" alt="" crossorigin="anonymous"></div>
  <div class="content">
    <h1 class="name" id="name" aria-label="Geordie Crawley"></h1>
  </div>
  <nav id="nav">
    <a href="game.html">Provenance — An Art Game</a>
    <a href="scripts.html">Performance Works</a>
    <a href="bio.html">Bio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <script>
    /* PHOTOS_START — do not edit this list by hand; run update-photos.command */
    const photos = [
      'images/F1000037.jpg',
      'images/F1010002.jpg',
      'images/F1010004.jpg',
      'images/F1010004_2.jpg',
      'images/F1010010.jpg',
      'images/F1010014.jpg',
      'images/F1010020.jpg',
      'images/F1010025.jpg',
      'images/F1010032.jpg',
      'images/F1020011.jpg',
      'images/F1020013.jpg',
      'images/IMG_0302-positive.jpg',
      'images/IMG_0312-positive.jpg',
      'images/IMG_0318-positive.jpg',
      'images/IMG_0322-positive.jpg',
      'images/IMG_0323-positive.jpg',
      'images/IMG_0324-positive.jpg',
      'images/IMG_0328-positive.jpg',
      'images/IMG_4335.jpg',
      'images/JP-SK_-_23.jpg'
    ];
    /* PHOTOS_END */
    const img = document.getElementById('bgImg');
    const nameEl = document.getElementById('name');
    const navEl = document.getElementById('nav');
    const canvas = document.getElementById('sampler');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const text = 'Geordie Crawley';
    const letters = [];
    for (const ch of text) {
      if (ch === ' ') {
        const sp = document.createElement('span');
        sp.className = 'space';
        nameEl.appendChild(sp);
      } else {
        const sp = document.createElement('span');
        sp.className = 'letter';
        sp.textContent = ch;
        nameEl.appendChild(sp);
        letters.push(sp);
      }
    }

    // Load only ONE random photo per visit
    const chosen = photos[Math.floor(Math.random() * photos.length)];
    img.src = chosen;

    function reveal(colour, shadow) {
      if (colour) {
        nameEl.style.color = colour;
        nameEl.style.textShadow = `0 2px 40px ${shadow}, 0 1px 5px ${shadow}`;
      } else {
        nameEl.style.color = '#e8e8e8';
      }
      nameEl.classList.add('visible');
      navEl.classList.add('visible');
    }

    img.addEventListener('load', () => {
      img.classList.add('loaded');
      let colour = null, shadow = 'rgba(0,0,0,0.5)';
      try {
        const s = 64;
        canvas.width = s; canvas.height = s;
        ctx.drawImage(img, 0, 0, s, s);
        const data = ctx.getImageData(0, 0, s, s).data;
        let tR=0,tG=0,tB=0; const n=s*s;
        for (let i=0;i<data.length;i+=4){ tR+=data[i]; tG+=data[i+1]; tB+=data[i+2]; }
        const aR=tR/n, aG=tG/n, aB=tB/n;
        const lum=(0.299*aR+0.587*aG+0.114*aB)/255;

        const hue=Math.floor(Math.random()*360);
        const sat=50+Math.floor(Math.random()*40);
        let light;
        if (lum>0.55) light=8+Math.floor(Math.random()*18);
        else if (lum<0.35) light=78+Math.floor(Math.random()*18);
        else light = (Math.random()>0.3) ? 82+Math.floor(Math.random()*14) : 8+Math.floor(Math.random()*15);

        colour=`hsl(${hue}, ${sat}%, ${light}%)`;
        const shadowAlpha = lum>0.5 ? 0.3 : 0.55;
        shadow=`rgba(0,0,0,${shadowAlpha})`;
      } catch (e) {
        // canvas sampling can fail in rare cases; fall back to light text
        colour = null;
      }
      reveal(colour, shadow);
    });

    img.addEventListener('error', () => reveal(null));

    // Letter mouse/touch avoidance — playful tuning
    const RADIUS = 200;
    const MAX_PUSH = 130;
    let pointer = { x: -9999, y: -9999, active: false };
    let rafPending = false;

    function updateLetters() {
      rafPending = false;
      for (let i = 0; i < letters.length; i++) {
        const el = letters[i];
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        if (!pointer.active) { el.style.transform = ''; continue; }
        const dx = cx - pointer.x;
        const dy = cy - pointer.y;
        const dist = Math.hypot(dx, dy);
        if (dist < RADIUS && dist > 0.001) {
          const t = 1 - dist / RADIUS;
          const force = t * t * (3 - 2 * t);
          const push = force * MAX_PUSH;
          const nx = (dx / dist) * push;
          const ny = (dy / dist) * push;
          const dir = (i % 2 === 0) ? 1 : -1;
          const rot = dir * force * 35;
          const scale = 1 + force * 0.35;
          el.style.transform = `translate(${nx}px, ${ny}px) rotate(${rot}deg) scale(${scale})`;
        } else {
          el.style.transform = '';
        }
      }
    }
    function queue() {
      if (!rafPending) { rafPending = true; requestAnimationFrame(updateLetters); }
    }
    window.addEventListener('mousemove', (e) => {
      pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; queue();
    });
    window.addEventListener('mouseleave', () => { pointer.active = false; queue(); });
    window.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (t) { pointer.x = t.clientX; pointer.y = t.clientY; pointer.active = true; queue(); }
    }, { passive: true });
    window.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (t) { pointer.x = t.clientX; pointer.y = t.clientY; pointer.active = true; queue(); }
    }, { passive: true });
    window.addEventListener('touchend', () => {
      setTimeout(() => { pointer.active = false; queue(); }, 400);
    });
  </script>
</body>
</html>
